<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESC Donor Prioritization</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="wrap">
        <!-- Title on the left, quadrant counts on the right -->
        <header class="page-head">
            <div>
                <h1>ESC Donor Prioritization</h1>
                <p class="sub">Hover over a point or a name to see the donor's profile. Click to keep it open.</p>
            </div>
            <div id="quadrant-counts" class="counts"></div>
        </header>

        <!-- Where the data came from, plus a button to pull the latest from the spreadsheet -->
        <div class="data-bar">
            <span id="data-status">Loading donor data...</span>
            <button type="button" id="refresh-data">Refresh data</button>
        </div>
        <p id="data-error" class="data-error" hidden></p>
        <details id="data-warnings" hidden><summary></summary><ul></ul></details>

        <!-- Chart card on the left, Priority Order card on the right -->
        <main class="layout">
            <section class="card chart-card">
                <div id="donor-chart"></div>
                <!-- Donor profile, shown beside a point on hover -->
                <div id="donor-profile" class="profile" hidden></div>
            </section>

            <aside class="card priority-card">
                <h3>Priority order</h3>
                <ol id="priority-list"></ol>
                <p class="note">Ranked by quadrant, then impact.</p>
            </aside>
        </main>
    </div>

    <script src="js/vendor/d3.v7.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
